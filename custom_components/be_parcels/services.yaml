add_parcel:
  name: Pakje toevoegen
  description: Voeg een pakje toe om te tracken (of werk het bij als het al bestaat).
  fields:
    carrier:
      name: Vervoerder
      required: true
      selector:
        select:
          options:
            - bpost
            - dpd
            - gls
            - postnl
            - dhl
            - deutsche_post
            - la_poste
            - chronopost
            - mondial_relay
            - ups
            - fedex
            - royal_mail
            - evri
            - an_post
            - poste_italiane
            - correos
            - ctt
            - austrian_post
            - postnord
            - poczta_polska
            - inpost
            - swiss_post
    tracking_number:
      name: Trackingnummer
      required: true
      selector:
        text:
    postal_code:
      name: Postcode
      description: Postcode van de ontvanger. Verplicht bij bpost en PostNL.
      required: false
      selector:
        text:
    name:
      name: Weergavenaam
      description: Optioneel, bv. "Schoenen van Zalando".
      required: false
      selector:
        text:

remove_parcel:
  name: Pakje verwijderen
  description: Stop met een pakje te tracken.
  fields:
    parcel_id:
      name: Pakje-ID
      description: >-
        De interne id van het pakje, zichtbaar als attribuut op de sensor
        of af te leiden als <vervoerder>_<trackingnummer> (kleine letters,
        underscores i.p.v. andere tekens).
      required: true
      selector:
        text:
